<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Клиника-кейс</title>
<style>
  :root{
    --bg:#ECEBE4; --surface:#FFFFFF; --surface-2:#E0E1DC;
    --ink:#4A4A44; --ink-soft:#6E6E64; --ink-faint:#9B9A8C;
    --accent:#777356; --accent-soft:#E7E5D6; --accent-ink:#514E38;
    --gold:#B07F32; --gold-soft:#F3E6CE;
    --line:#D9D7CB;
    --weak:#B4523F; --weak-soft:#F6E4E0;
    --mid:#B07F32; --mid-soft:#F3E6CE;
    --strong:#5B6B45; --strong-soft:#E4E8DA;
    --panel-dark:#2B2A22; --panel-dark-ink:#F1EFE4;
    --shadow: 0 1px 2px rgba(40,38,28,.05), 0 8px 24px -12px rgba(40,38,28,.16);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1B17; --surface:#232320; --surface-2:#2B2B25;
      --ink:#EDEBE1; --ink-soft:#B8B5A6; --ink-faint:#84826F;
      --accent:#A9A47C; --accent-soft:#33321F; --accent-ink:#DBD7B3;
      --gold:#D6A552; --gold-soft:#332816;
      --line:#38372E;
      --weak:#E0806B; --weak-soft:#2E1E1B;
      --mid:#D6A552; --mid-soft:#332816;
      --strong:#8FA170; --strong-soft:#28301F;
      --panel-dark:#0E0E0C; --panel-dark-ink:#EDEBE1;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1B17; --surface:#232320; --surface-2:#2B2B25;
    --ink:#EDEBE1; --ink-soft:#B8B5A6; --ink-faint:#84826F;
    --accent:#A9A47C; --accent-soft:#33321F; --accent-ink:#DBD7B3;
    --gold:#D6A552; --gold-soft:#332816;
    --line:#38372E;
    --weak:#E0806B; --weak-soft:#2E1E1B;
    --mid:#D6A552; --mid-soft:#332816;
    --strong:#8FA170; --strong-soft:#28301F;
    --panel-dark:#0E0E0C; --panel-dark-ink:#EDEBE1;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');

  *{ box-sizing:border-box; }
  body{ background:var(--bg); color:var(--ink); font-family:'Manrope',system-ui,sans-serif; margin:0; padding-bottom:60px; }
  h1,h2,h3{ font-family:'Nunito',system-ui,sans-serif; font-weight:800; text-wrap:balance; margin:0; }
  .mono{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }
  .wrap{ max-width:820px; margin:0 auto; padding-inline:20px; }
  button{ font-family:inherit; }

  header.top{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
    background:color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .top-inner{ max-width:820px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; flex:none; padding-right:14px; border-right:1px solid var(--line); }
  .brand img{ height:26px; width:auto; display:block; }
  .brand img.dark{ display:none; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand img.light{ display:none; } :root:not([data-theme="light"]) .brand img.dark{ display:block; } }
  :root[data-theme="dark"] .brand img.light{ display:none; }
  :root[data-theme="dark"] .brand img.dark{ display:block; }
  .top-inner h1{ font-size:1.05rem; margin-right:auto; display:flex; align-items:center; gap:8px; }
  .badge-mode{ font-family:'IBM Plex Mono',monospace; font-size:.68rem; padding:3px 8px; border-radius:99px; background:var(--accent-soft); color:var(--accent-ink); font-weight:500; }
  .badge-mode.tutor{ background:var(--gold-soft); color:var(--gold); }
  .link-btn{ background:none; border:1px solid var(--line); color:var(--ink-soft); font-size:.78rem; font-weight:600; padding:7px 12px; border-radius:8px; cursor:pointer; }
  .link-btn:hover{ border-color:var(--accent); color:var(--accent-ink); }
  .connbadge{ font-family:'IBM Plex Mono',monospace; font-size:.68rem; color:var(--ink-faint); display:flex; align-items:center; gap:5px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--ink-faint); }
  .dot.on{ background:var(--strong); }

  /* ---- menu ---- */
  .menu-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-top:22px; }
  .menu-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:var(--shadow); text-align:left; cursor:pointer; }
  .menu-card:disabled{ opacity:.45; cursor:not-allowed; }
  .menu-card h3{ font-size:1.02rem; }
  .menu-card p{ font-size:.8rem; color:var(--ink-faint); margin-top:4px; }
  .menu-tutor{ margin-top:26px; padding:20px; border-radius:14px; background:var(--panel-dark); color:var(--panel-dark-ink); display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; }
  .menu-tutor h3{ color:inherit; font-size:1.05rem; }
  .menu-tutor p{ font-size:.82rem; opacity:.7; margin-top:4px; }
  .menu-tutor button{ font-weight:800; font-size:.85rem; padding:12px 22px; border-radius:10px; border:none; background:var(--accent); color:#FFFFF3; cursor:pointer; flex:none; }

  /* ---- legend ---- */
  .legend{ margin-top:20px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:var(--shadow); }
  .legend .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-ink); font-weight:600; }
  .legend h2{ font-size:1.5rem; margin-top:6px; }
  .legend .city{ color:var(--ink-faint); font-size:.9rem; margin-top:2px; }
  .legend .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-top:16px; }
  .legend .cell{ background:var(--surface-2); border-radius:10px; padding:10px 12px; }
  .legend .cell .k{ font-size:.7rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; }
  .legend .cell .v{ font-size:.86rem; margin-top:3px; line-height:1.4; }
  .legend .problems{ margin-top:14px; font-size:.85rem; color:var(--ink-soft); line-height:1.6; }
  .legend .problems b{ color:var(--ink); }

  /* ---- blocks ---- */
  .block{ margin-top:14px; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; }
  .block .bh{ padding:15px 18px; display:flex; align-items:center; gap:12px; cursor:pointer; user-select:none; }
  .block .bh .num{ flex:none; width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:.8rem; font-weight:600; }
  .block .bh .titles{ flex:1; min-width:0; }
  .block .bh .titles .tt{ font-weight:700; font-size:.95rem; }
  .block .bh .titles .ss{ font-size:.73rem; color:var(--ink-faint); margin-top:1px; }
  .block .bh .chev{ color:var(--ink-faint); transition:transform .2s; font-size:.9rem; flex:none; }
  .block[data-open="1"] .chev{ transform:rotate(90deg); }
  .tierchip{ flex:none; font-size:.68rem; font-weight:700; padding:4px 9px; border-radius:99px; }
  .tierchip.weak{ background:var(--weak-soft); color:var(--weak); }
  .tierchip.mid{ background:var(--mid-soft); color:var(--mid); }
  .tierchip.strong{ background:var(--strong-soft); color:var(--strong); }
  .tierchip.none{ background:var(--surface-2); color:var(--ink-faint); }
  .block .body{ display:none; padding:0 18px 18px; }
  .block[data-open="1"] .body{ display:block; }

  .task-text{ font-size:.88rem; color:var(--ink-soft); line-height:1.6; background:var(--surface-2); padding:12px 14px; border-radius:10px; }
  .task-text b{ color:var(--ink); }
  .forbidden{ margin-top:8px; font-size:.8rem; color:var(--weak); }

  table.datatbl{ width:100%; border-collapse:collapse; margin-top:12px; font-size:.8rem; }
  table.datatbl th{ text-align:left; font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); padding:6px 8px; border-bottom:1px solid var(--line); }
  table.datatbl td{ padding:7px 8px; border-bottom:1px solid var(--line); font-family:'IBM Plex Mono',monospace; }
  table.datatbl td.name{ font-family:'Manrope',sans-serif; font-weight:600; }
  .wrap-table{ overflow-x:auto; }

  textarea{ width:100%; margin-top:14px; min-height:100px; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-family:'Manrope',sans-serif; font-size:.86rem; line-height:1.5; resize:vertical; }
  textarea:disabled{ opacity:.7; }
  textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .savehint{ font-size:.7rem; color:var(--ink-faint); margin-top:5px; font-family:'IBM Plex Mono',monospace; }

  .ai-box{ margin-top:14px; padding:12px 14px; border-radius:10px; background:var(--accent-soft); border:1px dashed color-mix(in srgb, var(--accent) 40%, transparent); }
  .ai-box .row1{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .ai-btn{ font-weight:700; font-size:.78rem; padding:8px 14px; border-radius:99px; border:1px solid var(--accent); background:var(--surface); color:var(--accent-ink); cursor:pointer; }
  .ai-btn:disabled{ opacity:.5; cursor:default; }
  .ai-result{ margin-top:10px; font-size:.83rem; color:var(--ink-soft); line-height:1.5; }
  .ai-result b{ color:var(--accent-ink); }
  .ai-hint{ margin-top:8px; font-size:.78rem; color:var(--ink-faint); }
  .ai-error{ margin-top:8px; font-size:.78rem; color:var(--weak); }

  .tierline{ display:flex; align-items:center; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .tierline .lbl{ font-size:.78rem; color:var(--ink-faint); }
  .tier-btn{ font-weight:700; font-size:.78rem; padding:7px 13px; border-radius:99px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-soft); cursor:pointer; }
  .tier-btn[data-active="1"][data-tier="weak"]{ background:var(--weak-soft); border-color:var(--weak); color:var(--weak); }
  .tier-btn[data-active="1"][data-tier="mid"]{ background:var(--mid-soft); border-color:var(--mid); color:var(--mid); }
  .tier-btn[data-active="1"][data-tier="strong"]{ background:var(--strong-soft); border-color:var(--strong); color:var(--strong); }

  .cblist{ display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .cbitem{ display:flex; align-items:flex-start; gap:10px; font-size:.83rem; line-height:1.45; color:var(--ink-soft); cursor:pointer; padding:9px 11px; border-radius:9px; background:var(--surface-2); }
  .cbitem input{ margin-top:2px; flex:none; width:16px; height:16px; accent-color:var(--strong); cursor:pointer; }
  .cbitem[data-checked="1"]{ color:var(--ink); }
  .cbitem[data-checked="1"] span{ font-weight:600; }

  .finale{ margin-top:20px; background:var(--panel-dark); color:var(--panel-dark-ink); border-radius:18px; padding:24px 22px; }
  .finale h2{ color:inherit; font-size:1.25rem; }
  .finale p.lede{ font-size:.85rem; opacity:.72; margin-top:8px; line-height:1.55; }
  .finale button{ margin-top:16px; font-weight:800; font-size:.86rem; padding:12px 22px; border-radius:10px; border:none; background:var(--accent); color:#FFFFF3; cursor:pointer; }
  .finale-reveal{ margin-top:16px; padding:16px 18px; border-radius:12px; background:rgba(255,255,255,.06); border-left:4px solid var(--gold); display:none; }
  .finale-reveal.show{ display:block; }
  .finale-reveal .rh{ font-family:'Nunito',sans-serif; font-size:1.05rem; font-weight:800; }
  .finale-reveal .rt{ font-family:'IBM Plex Mono',monospace; font-size:.82rem; opacity:.75; margin-top:2px; }
  .finale-reveal p{ font-size:.86rem; line-height:1.6; margin-top:8px; opacity:.9; }
  .revchart{ margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .revchart-row{ display:flex; align-items:center; gap:10px; }
  .revchart-label{ flex:0 0 auto; width:88px; font-size:.72rem; opacity:.7; }
  .revchart-track{ flex:1; height:14px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden; }
  .revchart-bar{ height:100%; border-radius:99px; transition:width .4s ease; }
  .revchart-val{ flex:0 0 auto; font-size:.78rem; font-weight:700; min-width:96px; text-align:right; }

  /* ---- tutor overview ---- */
  .ovwrap{ overflow-x:auto; margin-top:20px; border-radius:14px; border:1px solid var(--line); }
  table.ovtbl{ width:100%; border-collapse:collapse; background:var(--surface); font-size:.8rem; min-width:680px; }
  table.ovtbl th{ text-align:left; padding:10px 12px; background:var(--surface-2); font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); position:sticky; top:0; }
  table.ovtbl td{ padding:10px 12px; border-top:1px solid var(--line); vertical-align:middle; }
  table.ovtbl tr.rowlink{ cursor:pointer; }
  table.ovtbl tr.rowlink:hover{ background:var(--surface-2); }
  table.ovtbl .teamname{ font-weight:700; }
  table.ovtbl .teamcity{ font-size:.72rem; color:var(--ink-faint); }
  .minichip{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:3px; }
  .minichip.weak{ background:var(--weak); } .minichip.mid{ background:var(--gold); } .minichip.strong{ background:var(--strong); } .minichip.none{ background:var(--line); }

  .detail{ margin-top:16px; }
  .detail-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .detail-head h2{ font-size:1.3rem; }
  .closebtn{ background:none; border:1px solid var(--line); border-radius:8px; padding:6px 12px; font-size:.78rem; color:var(--ink-soft); cursor:pointer; }

  footer{ text-align:center; padding-top:36px; }
  footer p{ font-size:.76rem; color:var(--ink-faint); line-height:1.6; }
</style>

// Полные копии исходных кейсов: те же данные, задания и сценарии,
// с переименованием клиники и города во всех текстовых полях (включая историю,
// отзывы и сценарии), чтобы нигде не осталось следов исходного кейса.
function cloneCaseRenamed(src, renames){
  function walk(v){
    if(typeof v === 'string'){
      let out = v;
      renames.forEach(function(pair){ out = out.split(pair[0]).join(pair[1]); });
      return out;
    }
    if(Array.isArray(v)) return v.map(walk);
    if(v && typeof v === 'object'){
      const o = {};
      for(const k in v) o[k] = walk(v[k]);
      return o;
    }
    return v;
  }
  return walk(src);
}

const REMOTE_API_URL = 'https://script.google.com/macros/s/AKfycbx2pZjETbb4I3lzuyzY0Fm4w1j5QXRsdr0I_IYJRRTJccCWcnCKCUsXj0kww1oIvPNS/exec';

async function remoteGet(qs){
  try{
    const res = await fetch(REMOTE_API_URL + '?' + qs, { method:'GET' });
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}
async function remotePost(body){
  try{
    const res = await fetch(REMOTE_API_URL, { method:'POST', body: JSON.stringify(body) });
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}
function mergeDeep_(dst, src){
  for(const k in src){
    if(src[k] && typeof src[k]==='object' && !Array.isArray(src[k])){ dst[k]=dst[k]||{}; mergeDeep_(dst[k], src[k]); }
    else dst[k]=src[k];
  }
  return dst;
}

function blankAnswers(){
  const o = {};
  BLOCKS.forEach(b => {
    const cbFields = { checkedItems:{}, checklistReviewed:false, aiChecked:null, aiExtra:null };
    if(b.type === 'stages'){
      const stages = {}; PJM_STAGES.forEach(s=> stages[s.id] = "");
      o[b.id] = Object.assign({ stages, aiTier:null, aiRationale:null, tutorTier:null }, cbFields);
    }else if(b.type === 'list'){
      o[b.id] = Object.assign({ items:[""], aiTier:null, aiRationale:null, tutorTier:null }, cbFields);
    }else if(b.type === 'channels'){
      o[b.id] = Object.assign({ budgets:{}, reasons:{}, aiTier:null, aiRationale:null, tutorTier:null }, cbFields);
    }else{
      const base = Object.assign({ text:"", aiTier:null, aiRationale:null, tutorTier:null }, cbFields);
      if(BLOCK_SECTIONS[b.id]){
        base.sections = {};
        BLOCK_SECTIONS[b.id].forEach((_,idx)=> base.sections[idx] = "");
      }
      if(BLOCK_CHOICES[b.id]) base.choice = null;
      o[b.id] = base;
    }
  });
  return o;
}
function answerPlainText(block, ans, task){
  if(!ans) return '';
  if(block.type === 'stages'){
    return PJM_STAGES.map(s => { const v=(ans.stages&&ans.stages[s.id]||'').trim(); return v ? (s.label+': '+v) : ''; }).filter(Boolean).join('\n');
  }
  if(block.type === 'list'){
    return (ans.items||[]).map(x=>(x||'').trim()).filter(Boolean).map((x,i)=>(i+1)+'. '+x).join('\n');
  }
  if(block.type === 'channels'){
    const chans = (task && task.channels) ? task.channels : [];
    const budgets = ans.budgets || {};
    const reasons = ans.reasons || {};
    const lines = chans.map((ch,idx)=>{
      const b = (budgets[idx]||'').toString().trim();
      const r = (reasons[idx]||'').toString().trim();
      if(!b && !r) return '';
      return ch[0]+': было '+ch[1]+' ₽ → '+(b||'—')+' ₽'+(r?' — '+r:'');
    }).filter(Boolean);
    return lines.join('\n');
  }
  const choicePrefix = ans.choice ? ('Выбранная стратегия: '+ans.choice+'\n\n') : '';
  return choicePrefix + (ans.text || '');
}
function answerFilled(block, ans){
  if(!ans) return false;
  if(block.type === 'stages') return PJM_STAGES.some(s => (ans.stages&&ans.stages[s.id]||'').trim());
  if(block.type === 'list') return (ans.items||[]).some(x=>(x||'').trim());
  if(block.type === 'channels') return Object.values(ans.budgets||{}).some(v=>(v||'').toString().trim()) || Object.values(ans.reasons||{}).some(v=>(v||'').toString().trim());
  return !!(ans.text||'').trim();
}

async function ensureTeam(slug){
  const c = CASES[slug];
  if(!c) return null;
  if(dbCap){
    const ref = dbCap.doc('teams/'+slug);
    let snap;
    try{ snap = await ref.get(); }catch(e){ return null; }
    if(!snap.exists){
      const skeleton = { caseId:slug, label:c.name, answers:blankAnswers(), revealed:false, openBlocks:{}, updatedAt:new Date().toISOString() };
      try{ await ref.set(skeleton); }catch(e){}
      return skeleton;
    }
    return snap.data();
  }
  if(remoteAvailable){
    const skeleton = { caseId:slug, label:c.name, answers:blankAnswers(), revealed:false, openBlocks:{}, updatedAt:new Date().toISOString() };
    const resp = await remotePost({ action:'ensure', slug, skeleton });
    if(resp && resp.ok && resp.team){
      memStore[slug] = resp.team; saveLocalStore(memStore);
      return resp.team;
    }
  }
  if(!memStore[slug]){ memStore[slug] = { caseId:slug, label:c.name, answers:blankAnswers(), revealed:false, openBlocks:{}, updatedAt:new Date().toISOString() }; saveLocalStore(memStore); }
  return memStore[slug];
}

let patchQueues = {}; // сериализуем записи по каждой команде — одна запись за раз
function patchTeam(slug, patch){
  const prev = patchQueues[slug] || Promise.resolve();
  const run = prev.catch(()=>{}).then(async ()=>{
    if(dbCap){
      try{
        await dbCap.doc('teams/'+slug).update(Object.assign({updatedAt:new Date().toISOString()}, patch));
        return true;
      }catch(e){
        return false;
      }
    }
    if(remoteAvailable){
      const resp = await remotePost({ action:'patch', slug, patch });
      if(resp && resp.ok){
        const t = memStore[slug] || {};
        mergeDeep_(t, patch);
        t.updatedAt = (resp.team && resp.team.updatedAt) || new Date().toISOString();
        memStore[slug] = t; saveLocalStore(memStore);
        return true;
      }
      // сервер недоступен в эту секунду — пишем локально, чтобы не потерять ответ; следующий patch попробует снова
    }
    const t = memStore[slug]; if(!t) return false;
    mergeDeep_(t, patch);
    saveLocalStore(memStore);
    return true;
  });
  patchQueues[slug] = run;
  return run;
}

function subscribeTeam(slug, cb){
  if(dbCap){
    return dbCap.doc('teams/'+slug).onSnapshot(snap => { if(snap.exists) cb(snap.data()); }, ()=>{});
  }
  if(remoteAvailable){
    let stopped = false, lastJson = null, timer = null;
    async function poll(){
      if(stopped) return;
      const resp = await remoteGet('action=get&slug='+encodeURIComponent(slug));
      if(resp && resp.ok && resp.team){
        const j = JSON.stringify(resp.team);
        if(j !== lastJson){ lastJson = j; memStore[slug] = resp.team; saveLocalStore(memStore); cb(resp.team); }
      }
      if(!stopped) timer = setTimeout(poll, 3000);
    }
    poll();
    return ()=>{ stopped = true; if(timer) clearTimeout(timer); };
  }
  cb(memStore[slug]); return ()=>{};
}

function subscribeAllTeams(cb){
  if(dbCap){
    return dbCap.collection('teams').onSnapshot(qs => {
      const map = {}; qs.docs.forEach(d => map[d.id] = d.data()); cb(map);
    }, ()=>{});
  }
  if(remoteAvailable){
    let stopped = false, lastJson = null, timer = null;
    async function poll(){
      if(stopped) return;
      const resp = await remoteGet('action=all');
      if(resp && resp.ok && resp.teams){
        const j = JSON.stringify(resp.teams);
        if(j !== lastJson){ lastJson = j; cb(resp.teams); }
      }
      if(!stopped) timer = setTimeout(poll, 4000);
    }
    poll();
    return ()=>{ stopped = true; if(timer) clearTimeout(timer); };
  }
  cb(Object.assign({}, memStore)); return ()=>{};
}

// ---------- helpers ----------
function stripHtml(s){ return (s||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim(); }
function tierLabel(t){ return t==='weak'?'Слабо':t==='mid'?'Средне':t==='strong'?'Сильно':'—'; }
function computeScenarioTier(slug, answers){
  const key = CASE_KEY_BLOCKS[slug] || [];
  const counts = {weak:0, mid:0, strong:0};
  let n = 0;
  BLOCKS.forEach(b => {
    const t = answers?.[b.id]?.tutorTier;
    if(t){
      const w = key.includes(b.id) ? 2 : 1; // ключевые для этой клиники блоки весят вдвое больше
      counts[t] += w;
      n++;
    }
  });
  if(!n) return {tier:null, n:0};
  const tier = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
  return {tier, n};
}

function chipHtml(slug, blockId, ans){
  const items = CHECKLISTS[slug] && CHECKLISTS[slug][blockId];
  if(items){
    if(blockId === 'strategy' && STRATEGY_ANSWER[slug]){
      if(!ans.choice) return '<span class="tierchip none">не оценено</span>';
      const on = ans.choice === STRATEGY_ANSWER[slug];
      return '<span class="tierchip '+(on?'strong':'weak')+'">'+(on?1:0)+'/'+items.length+'</span>';

    const cls = items.length ? (found/items.length>=0.67?'strong':found/items.length>=0.34?'mid':'weak') : 'none';
    return '<span class="tierchip '+cls+'">'+found+'/'+items.length+'</span>';
  }
  const tier = ans.tutorTier;
  return '<span class="tierchip '+(tier||'none')+'">'+(tier?tierLabel(tier):'не оценено')+'</span>';
}

function financeBase(c){
  const toNum = s => parseFloat(String(s).replace(/[^\d,.]/g,'').replace(/\s/g,'').replace(',','.'))||0;
  const revenue = toNum(c.tasks.metrics.finance.revenue.total);
  const profit = toNum(c.tasks.metrics.finance.profit.total);
  return { revenue, profit, margin: revenue ? profit/revenue : 0 };
}
function ratioColor(ratio){ return ratio>=0.67?'var(--strong)': ratio>=0.34?'var(--gold)':'var(--weak)'; }
function fmtMln(n){ return (n/1000000).toLocaleString('ru-RU',{maximumFractionDigits:1,minimumFractionDigits:1})+' млн ₽'; }
function outroForRatio(ratio){
  if(ratio>=0.8) return 'Команда, которая довела дело до конца, получает клинику, которая больше не держится на одном человеке.';
  if(ratio>=0.5) return 'Часть решений прижилась, часть осталась на бумаге — через год это заметно по цифрам, но не по всем.';
  if(ratio>=0.2) return 'Отдельные решения сработали, но системной картины не сложилось.';
  return 'Почти ничего не изменилось — через год клиника пришла к тем же проблемам, просто в большем масштабе.';
}
function assembleChecklistFuture(slug, team){
  const c = CASES[slug];
  const cl = CHECKLISTS[slug];
  const base = financeBase(c);
  let total=0, found=0, reviewedBlocks=0;
  let revTotal=0, revFound=0, mgnTotal=0, mgnFound=0;
  const paragraphs = [];
  BLOCKS.forEach(b=>{
    const items = cl[b.id];
    if(!items) return;
    const ans = team.answers?.[b.id] || {};
    const isStrategyAuto = (b.id === 'strategy' && STRATEGY_ANSWER[slug]);
    if(isStrategyAuto){
      if(!ans.choice) return;
    }else if(!ans.checklistReviewed){
      return;
    }
    reviewedBlocks++;
    const checked = isStrategyAuto ? { correct_strategy: ans.choice === STRATEGY_ANSWER[slug] } : (ans.checkedItems || {});
    const sentences = items.map(it=>{
      total++;
      revTotal += (it.rev||0); mgnTotal += (it.mgn||0);
      const on = !!checked[it.id];
      if(on){ found++; revFound += (it.rev||0); mgnFound += (it.mgn||0); }
      return on ? it.found : it.missing;
    });
    if(ans.aiExtra && ans.aiExtra.trim()){
      sentences.push('Команда также предложила своё решение, которого не было в чек-листе: «'+ans.aiExtra.trim()+'» — и это тоже пошло клинике в плюс.');
    }
    paragraphs.push(sentences.join(' '));
  });
  const totalBlocks = Object.keys(cl).length;
  const ratio = total ? found/total : 0;
  const revRatio = revTotal ? revFound/revTotal : 0;
  const mgnRatio = mgnTotal ? mgnFound/mgnTotal : 0;
  const revenue = base.revenue * (1 + revRatio * 0.9);
  const margin = base.margin + mgnRatio * 0.08;
  const profit = revenue * margin;
  return { paragraphs, found, total, ratio, reviewedBlocks, totalBlocks, base, revenue, profit };
}
function financeChartHtml(base, revenue, profit, ratio){

  const maxProfit = Math.max(base.profit, profit) * 1.12 || 1;
  const wRevBefore = Math.max(6, Math.round(base.revenue/maxRev*100));
  const wRevAfter = Math.max(6, Math.round(revenue/maxRev*100));
  const wProfitBefore = Math.max(6, Math.round(base.profit/maxProfit*100));
  const wProfitAfter = Math.max(6, Math.round(profit/maxProfit*100));
  return '<div style="margin-top:2px;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;opacity:.6;">Выручка / мес</div>'+
    '<div class="revchart">'+

    '<div class="revchart-row"><div class="revchart-label">Стало</div><div class="revchart-track"><div class="revchart-bar" style="width:'+wRevAfter+'%;background:'+color+';"></div></div><div class="revchart-val mono">'+fmtMln(revenue)+'</div></div>'+
    '</div>'+

function reviewsHtml(reviews){
  const stars = n => '★'.repeat(n)+'☆'.repeat(5-n);
  let h = '<div style="margin-top:14px;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);">Отзывы пациентов</div>';
  h += '<div style="display:flex;flex-direction:column;gap:8px;margin-top:8px;">';
  reviews.forEach(rv=>{
    h += '<div style="background:var(--surface-2);border-radius:10px;padding:10px 12px;">'+
      '<div style="display:flex;justify-content:space-between;gap:8px;font-size:.78rem;"><b>'+rv[0]+'</b><span class="mono" style="color:var(--gold);">'+stars(rv[1])+'</span></div>'+
      '<div style="font-size:.82rem;color:var(--ink-soft);margin-top:4px;line-height:1.5;">'+rv[2]+'</div></div>';
  });
  h += '</div>';
  return h;
}

// ---------- routing ----------
window.addEventListener('hashchange', route);
// Секретный ключ ведущего — без него #tutor / ?mode=tutor не откроется.
// Ссылка для ведущих: …/clinic-case/?mode=tutor&key=sklyarov-tutor-2026 (дать только своей команде).
const TUTOR_KEY = 'sklyarov-tutor-2026';
const TUTOR_SESSION_FLAG = 'clinicCaseTracker.tutorAuthed.v1';
function tutorAuthed(){
  try{
    const qs = new URLSearchParams(location.search);
    if(qs.get('key') === TUTOR_KEY){ sessionStorage.setItem(TUTOR_SESSION_FLAG, '1'); return true; }
    return sessionStorage.getItem(TUTOR_SESSION_FLAG) === '1';
  }catch(e){ return false; }
}
function currentHashValue(){
  let h = location.hash || '';
  if(!h){
    const i = location.href.indexOf('#');
    if(i !== -1) h = location.href.slice(i);
  }
  if(!h){
    // некоторые способы открытия страницы не прокидывают fragment (#...) —
    // на этот случай поддерживаем те же адреса в виде query-параметров (?team=... / ?mode=tutor)
    try{
      const qs = new URLSearchParams(location.search);
      const qMode = qs.get('mode');
      const qTeam = qs.get('team');
      if(qMode === 'tutor') h = '#tutor';
      else if(qTeam) h = '#team='+qTeam;
    }catch(e){}
  }
  return h;
}
function route(){
  const h = currentHashValue().replace('#','');
  const app = document.getElementById('app');
  const modeTitle = document.getElementById('modeTitle');
  const tutorBtn = document.getElementById('tutorBtn');
  const navBtn = document.getElementById('navBtn');
  const isTutor = tutorAuthed();
  if(tutorBtn) tutorBtn.style.display = isTutor ? '' : 'none';
  if(navBtn) navBtn.style.display = isTutor ? '' : 'none';
  if(h.startsWith('team=')){
    const slug = h.slice(5);
    if(!CASES[slug]){ app.innerHTML = '<p style="margin-top:40px;color:var(--ink-faint);">Команда с таким адресом не найдена.</p>'; return; }
    modeTitle.textContent = '🏥 ' + CASES[slug].name;
    renderTeam(slug);
  }else if(h === 'tutor'){
    if(!isTutor){
      // нет верного ключа — тихо показываем обычное меню команд, без намёка на существование пульта
      modeTitle.textContent = 'Клиника-кейс';
      renderMenu();
      return;
    }
    modeTitle.innerHTML = 'Пульт ведущего <span class="badge-mode tutor">ведущий</span>';
    renderTutor();
  }else{
    modeTitle.textContent = 'Клиника-кейс';
    renderMenu();
  }
}

function renderMenu(){
  const app = document.getElementById('app');
  const cards = SLUG_ORDER.map(slug=>{
    const c = CASES[slug];
    return '<button class="menu-card" '+(c.ready?'':'disabled')+' onclick="location.hash=\'team='+slug+'\'">'+
      '<h3>'+c.name+'</h3><p>'+c.city+(c.ready?'':' · кейс в разработке')+'</p></button>';
  }).join('');
  app.innerHTML =
    '<p style="margin-top:22px;color:var(--ink-soft);font-size:.92rem;">Выберите свою команду — или откройте личную ссылку вида <span class="mono">…#team=happy</span>, которую даст ведущий.</p>'+
    '<div class="menu-grid">'+cards+'</div>';
}

// ---------- team view ----------
let teamUnsub = null;
async function renderTeam(slug){
  if(teamUnsub) teamUnsub();
  const app = document.getElementById('app');
  const c = CASES[slug];
  if(!c.ready){
    app.innerHTML = '<div class="legend"><span class="eyebrow">Легенда команды</span><h2>'+c.name+'</h2><div class="city">'+c.city+'</div>'+
      '<p style="margin-top:16px;color:var(--ink-soft);font-size:.9rem;">Этот кейс ещё в разработке — цифры показателей и задания появятся позже. Сегодня для прогона доступны Happy Smile (#team=happy) и White Crown (#team=white).</p></div>';
    return;
  }
  await ensureTeam(slug);
  app.innerHTML = '<div id="legendBox"></div><div id="blocksBox"></div><div id="finaleBox"></div>';

  const story = c.story ? '<p style="margin-top:10px;font-size:.9rem;line-height:1.65;color:var(--ink-soft);">'+c.story+'</p>' : '';
  const cells = Object.entries(c.legend).map(([k,v])=> '<div class="cell"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>').join('');
  const reviews = c.reviews ? reviewsHtml(c.reviews) : '';
  document.getElementById('legendBox').innerHTML =
    '<div class="legend"><span class="eyebrow">Легенда команды</span><h2>'+c.name+'</h2><div class="city">'+c.city+'</div>'+
    story+'<div class="grid" style="margin-top:16px;">'+cells+'</div>'+reviews+'</div>';

  teamUnsub = subscribeTeam(slug, (team)=>{ renderTeamBlocks(slug, team); renderFinale(slug, team); });
}

function renderFinale(slug, team){
  const box = document.getElementById('finaleBox');
  if(!box) return;
  if(team.revealed){
    if(!box.querySelector('.finale')){
      box.innerHTML = '<div class="finale"><h2>Будущее клиники</h2>'+
        '<p class="lede">Ведущий открыл финал — узнайте, что стало с клиникой через год.</p>'+
        '<button onclick="revealTeam(\''+slug+'\')">Узнать будущее клиники</button>'+
        '<div class="finale-reveal" id="finaleReveal"></div></div>';
    }
  }else{
    box.innerHTML = '<div class="finale"><h2>Будущее клиники</h2>'+
      '<p class="lede">Финал появится здесь, когда ведущий защитит блоки со всеми командами и откроет будущее клиники.</p></div>';
  }
}

function anyFieldFocused(box){
  const a = document.activeElement;
  return !!(a && box.contains(a) && (a.tagName==='TEXTAREA' || a.tagName==='INPUT'));
}
function anyFieldDirty(box){
  return !!box.querySelector('[data-dirty="1"]');
}
function renderTeamBlocks(slug, team){
  const c = CASES[slug];
  const box = document.getElementById('blocksBox');
  if(!box) return;
  if(box.childElementCount && (anyFieldFocused(box) || anyFieldDirty(box))){
    // не перерисовываем, пока печатают или пока есть неотправленные изменения — только лёгкий патч оценок и чужих полей
    BLOCKS.forEach(b=>{
      const ans = team.answers?.[b.id] || {};
      const blockEl = document.getElementById('block_'+b.id);
      if(!blockEl) return;
      const tier = ans.tutorTier;
      const chipEl = blockEl.querySelector('.tierchip');
      if(chipEl){ chipEl.className = 'tierchip '+(tier||'none'); chipEl.textContent = tier?tierLabel(tier):'не оценено'; }
      if(b.type === 'text' && BLOCK_SECTIONS[b.id]){
        const sections = ans.sections || {};
        BLOCK_SECTIONS[b.id].forEach((_,idx)=>{
          const ta = document.getElementById('ta_'+b.id+'_s'+idx);
          const v = sections[idx]||'';
          if(ta && ta !== document.activeElement && ta.dataset.dirty !== '1' && ta.value !== v) ta.value = v;
        });
      }else if(b.type === 'text'){
        const ta = document.getElementById('ta_'+b.id);
        if(ta && ta !== document.activeElement && ta.dataset.dirty !== '1' && ta.value !== (ans.text||'')) ta.value = ans.text||'';
        if(BLOCK_CHOICES[b.id]){
          const choiceBlockEl = document.getElementById('block_'+b.id);
          if(choiceBlockEl){
            choiceBlockEl.querySelectorAll('.cblist input[type=checkbox]').forEach(inp=>{
              if(inp.dataset.dirty === '1') return;
              const lbl = inp.closest('.cbitem');
              const optText = lbl ? lbl.querySelector('span').textContent : '';
              const shouldCheck = ans.choice === optText;
              if(inp.checked !== shouldCheck){ inp.checked = shouldCheck; if(lbl) lbl.dataset.checked = shouldCheck?'1':'0'; }
            });
          }
        }
      }else if(b.type === 'stages'){
        PJM_STAGES.forEach(s=>{
          const ta = document.getElementById('ta_'+b.id+'_'+s.id);
          const v = (ans.stages && ans.stages[s.id]) || '';
          if(ta && ta !== document.activeElement && ta.dataset.dirty !== '1' && ta.value !== v) ta.value = v;
        });
      }else if(b.type === 'channels'){
        const wrap = document.getElementById('chdec_'+b.id);
        const budgets = ans.budgets || {};
        const reasons = ans.reasons || {};
        (task.channels||[]).forEach((ch,idx)=>{
          const inp = document.getElementById('chb_'+b.id+'_'+idx);
          const vB = (budgets[idx]!==undefined && budgets[idx]!=='') ? budgets[idx] : ch[1];
          if(inp && inp !== document.activeElement && inp.dataset.dirty !== '1' && inp.value !== String(vB)) inp.value = vB;
          const ta = document.getElementById('chr_'+b.id+'_'+idx);
          const vR = reasons[idx] || '';
          if(ta && ta !== document.activeElement && ta.dataset.dirty !== '1' && ta.value !== vR) ta.value = vR;
        });
        if(wrap) updateChannelTotal(b.id);
      }
      // список чек-листа при фокусе/неотправленных правках не трогаем — во избежание скачков позиций
    });
    return;
  }
  const activeIds = new Set(Array.from(box.querySelectorAll('.block[data-open="1"]')).map(el=>el.id));
  box.innerHTML = BLOCKS.map((b,i)=>{
    const task = c.tasks[b.id];
    const ans = team.answers?.[b.id] || {};
    const domId = 'block_'+b.id;
    const released = !!(team.openBlocks && team.openBlocks[b.id]);
    if(!released){
      return '<div class="block" id="'+domId+'" style="opacity:.55;">'+
        '<div class="bh" style="cursor:default;">'+
          '<div class="num">'+(i+1)+'</div>'+
          '<div class="titles"><div class="tt">'+b.abbr+'</div><div class="ss">Заблокировано — откроет ведущий, когда дойдёт очередь</div></div>'+
          '<div class="chev">🔒</div>'+
        '</div>'+
      '</div>';
    }
    const extra = taskExtraHtml(task, true, slug, b.id, ans);
    const forbidden = task.forbidden ? '<div class="forbidden">'+task.forbidden+'</div>' : '';
    const open = activeIds.has(domId) || i===0;
    const chip = chipHtml(slug, b.id, ans);
    let fieldsHtml = '';
    if(b.type === 'stages'){
      fieldsHtml = '<div style="display:flex;flex-direction:column;gap:10px;margin-top:14px;">'+PJM_STAGES.map(s=>{
        const v = (ans.stages && ans.stages[s.id]) || '';
        return '<div><div style="font-size:.78rem;font-weight:700;">'+s.label+'</div>'+
          '<div style="font-size:.72rem;color:var(--ink-faint);margin-top:1px;">'+s.hint+'</div>'+
          '<textarea style="min-height:56px;margin-top:6px;" id="ta_'+b.id+'_'+s.id+'" placeholder="Потеря или вау-момент на этом этапе…" oninput="markDirty(\''+b.id+'\',this)">'+v+'</textarea></div>';
      }).join('')+'</div>';
    }else if(b.type === 'list'){
      const items = ans.items && ans.items.length ? ans.items : (ans.text ? [ans.text] : ['']);
      fieldsHtml = '<div id="listwrap_'+b.id+'" style="display:flex;flex-direction:column;gap:8px;margin-top:14px;">'+items.map((v,idx)=> listRowHtml(b.id, v, idx)).join('')+
      '</div><button type="button" class="link-btn" style="margin-top:10px;" onclick="addChecklistItem(\''+b.id+'\')">+ добавить пункт</button>';
    }else if(b.type === 'channels'){
      const budgets = ans.budgets || {};
      const reasons = ans.reasons || {};
      const oldTotal = (task.channels||[]).reduce((sum,ch)=> sum + (parseFloat(String(ch[1]).replace(/[^\d.]/g,''))||0), 0);
      const rows = (task.channels||[]).map((ch,idx)=>{
        const name = ch[0];
        const oldBudget = ch[1];
        const curBudget = (budgets[idx]!==undefined && budgets[idx]!=='') ? budgets[idx] : oldBudget;
        const curReason = reasons[idx] || '';
        return '<div style="margin-top:10px;padding:11px 12px;border-radius:9px;background:var(--surface-2);">'+
          '<div style="font-size:.83rem;font-weight:600;">'+name+'</div>'+
          '<div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;">'+
            '<div style="flex:1;min-width:120px;">'+
              '<div style="font-size:.68rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;">Прошедший период</div>'+
              '<div class="mono" style="font-size:.85rem;margin-top:3px;">'+oldBudget+' ₽</div>'+
            '</div>'+
            '<div style="flex:1;min-width:140px;">'+
              '<div style="font-size:.68rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;">Новый период</div>'+
              '<input type="text" inputmode="numeric" class="mono" id="chb_'+b.id+'_'+idx+'" value="'+String(curBudget).replace(/"/g,'&quot;')+'" placeholder="Новый бюджет"'+
                ' style="width:100%;margin-top:3px;padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.85rem;box-sizing:border-box;"'+
                ' oninput="markDirty(\''+b.id+'\',this);updateChannelTotal(\''+b.id+'\')">'+
            '</div>'+
          '</div>'+
          '<div style="margin-top:8px;">'+
            '<div style="font-size:.68rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;">Причины принятого решения</div>'+
            '<textarea id="chr_'+b.id+'_'+idx+'" style="min-height:44px;margin-top:3px;" placeholder="Почему именно так" oninput="markDirty(\''+b.id+'\',this)">'+curReason+'</textarea>'+
          '</div>'+
        '</div>';
      }).join('');
      fieldsHtml = '<div id="chdec_'+b.id+'" data-old-total="'+oldTotal+'">'+rows+
        '<div class="savehint" id="chtot_'+b.id+'" style="margin-top:10px;font-size:.76rem;"></div></div>';
    }else if(BLOCK_SECTIONS[b.id]){
      const sections = ans.sections || {};
      fieldsHtml = '<div style="display:flex;flex-direction:column;gap:14px;margin-top:14px;">'+BLOCK_SECTIONS[b.id].map((sec,idx)=>
        '<div><div style="font-size:.78rem;font-weight:700;">'+sec.label+'</div>'+
          '<textarea style="min-height:90px;margin-top:6px;" id="ta_'+b.id+'_s'+idx+'" placeholder="'+sec.placeholder+'" oninput="markDirty(\''+b.id+'\',this)">'+(sections[idx]||'')+'</textarea></div>'
      ).join('')+'</div>';
    }else{
      const defaultPlaceholder = BLOCK_PLACEHOLDERS[b.id] || 'Впишите основные проблемы, которые видите, и возможные решения к каждой проблеме';
      const choicesHtml = BLOCK_CHOICES[b.id] ? ('<div class="cblist" style="margin-top:14px;">'+BLOCK_CHOICES[b.id].map(opt=>{
        const on = ans.choice === opt;
        return '<label class="cbitem" data-checked="'+(on?1:0)+'">'+
          '<input type="checkbox" '+(on?'checked':'')+' data-dirty="0" onclick="selectStrategyChoice(\''+b.id+'\',this)">'+
          '<span>'+opt+'</span>'+
        '</label>';
      }).join('')+'</div>') : '';
      fieldsHtml = choicesHtml+'<textarea id="ta_'+b.id+'" placeholder="'+(task.placeholder||defaultPlaceholder)+'" oninput="markDirty(\''+b.id+'\',this)">'+(ans.text||'')+'</textarea>';
    }
    return (
      '<div class="block" id="'+domId+'" data-open="'+(open?1:0)+'">'+
        '<div class="bh" onclick="toggleBlock(\''+domId+'\')">'+
          '<div class="num">'+(i+1)+'</div>'+
          '<div class="titles"><div class="tt">'+b.title+'</div><div class="ss">'+b.short+'</div></div>'+
          chip+'<div class="chev">›</div>'+
        '</div>'+
        '<div class="body">'+
          '<div class="task-text">'+task.text+'</div>'+forbidden+extra+
          fieldsHtml+
          '<div style="display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;"><button type="button" class="ai-btn" id="submitbtn_'+b.id+'" onclick="submitAnswer(\''+slug+'\',\''+b.id+'\')">Отправить ответ</button><div class="savehint" id="save_'+b.id+'">нажмите «Отправить ответ», когда закончите</div></div>'+
        '</div>'+
      '</div>'
    );
  }).join('');
  BLOCKS.forEach(b=>{ if(b.type === 'channels') updateChannelTotal(b.id); });
}

function toggleBlock(domId){
  const el = document.getElementById(domId);
  el.dataset.open = el.dataset.open === '1' ? '0' : '1';
}

function saveHint(blockId, msg){
  const hint = document.getElementById('save_'+blockId);
  if(hint) hint.textContent = msg;
}

// Команда печатает локально, ничего не уходит в базу до явного клика «Отправить ответ».
// Так честнее показываем статус и не шлём десятки перекрывающихся записей в один и тот же документ команды.
function markDirty(blockId, el){
  if(el) el.dataset.dirty = '1';
  saveHint(blockId, 'есть неотправленные изменения — нажмите «Отправить ответ»');
}
function clearDirty(blockId){
  const blockEl = document.getElementById('block_'+blockId);
  if(!blockEl) return;
  blockEl.querySelectorAll('[data-dirty]').forEach(el=> el.dataset.dirty = '0');
}
function selectStrategyChoice(blockId, el){
  const list = el.closest('.cblist');
  if(list){
    Array.from(list.querySelectorAll('input[type=checkbox]')).forEach(inp=>{
      if(inp!==el) inp.checked = false;
      inp.dataset.dirty = '1';
      const lbl = inp.closest('.cbitem');
      if(lbl) lbl.dataset.checked = inp.checked ? '1':'0';
    });
  }
  markDirty(blockId, el);
}
function updateChannelTotal(blockId){
  const wrap = document.getElementById('chdec_'+blockId);
  if(!wrap) return;
  const oldTotal = parseFloat(wrap.dataset.oldTotal)||0;
  const inputs = Array.from(wrap.querySelectorAll('input[id^="chb_'+blockId+'_"]'));
  const newTotal = inputs.reduce((sum,inp)=> sum + (parseFloat(String(inp.value).replace(/[^\d.]/g,''))||0), 0);
  const hint = document.getElementById('chtot_'+blockId);
  if(!hint) return;
  const fmt = n => Math.round(n).toLocaleString('ru-RU')+' ₽';
  const over = newTotal > oldTotal + 0.5;
  hint.style.color = over ? 'var(--weak)' : 'var(--strong)';
  hint.textContent = 'Итого: было '+fmt(oldTotal)+' \u2192 сейчас '+fmt(newTotal)+(over ? ' — бюджет вырос, проверьте распределение' : '');
}

function listRowHtml(blockId, val, idx){
  return '<div style="display:flex;gap:8px;align-items:center;">'+
    '<span class="mono" style="flex:none;width:20px;color:var(--ink-faint);font-size:.78rem;">'+(idx+1)+'.</span>'+
    '<input type="text" value="'+(val||'').replace(/"/g,'&quot;')+'" placeholder="Один пункт — одно действие" data-dirty="0" style="flex:1;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.85rem;" oninput="markDirty(\''+blockId+'\',this)">'+
    '<button type="button" onclick="removeChecklistItem(\''+blockId+'\',this)" style="flex:none;border:none;background:none;color:var(--ink-faint);cursor:pointer;font-size:1rem;">✕</button>'+
  '</div>';
}
function renumberListRows(blockId){
  const wrap = document.getElementById('listwrap_'+blockId);
  if(!wrap) return;
  Array.from(wrap.children).forEach((row,idx)=>{
    const span = row.querySelector('.mono');
    if(span) span.textContent = (idx+1)+'.';
  });
}
function addChecklistItem(blockId){
  const wrap = document.getElementById('listwrap_'+blockId);
  if(!wrap) return;
  wrap.insertAdjacentHTML('beforeend', listRowHtml(blockId, '', wrap.children.length));
  markDirty(blockId, wrap);
}
function removeChecklistItem(blockId, btn){
  const wrap = document.getElementById('listwrap_'+blockId);
  if(!wrap) return;
  const row = btn.closest('div');
  if(wrap.children.length > 1){ row.remove(); }
  else{ const inp = row.querySelector('input'); if(inp) inp.value=''; }
  renumberListRows(blockId);
  markDirty(blockId, wrap);
}

async function submitAnswer(slug, blockId){
  const block = BLOCKS.find(x=>x.id===blockId);
  if(!block) return;
  const btn = document.getElementById('submitbtn_'+blockId);
  if(btn) btn.disabled = true;
  saveHint(blockId, 'отправляется…');
  let patch;
  if(block.type === 'stages'){
    const stages = {};
    PJM_STAGES.forEach(s=>{ const ta = document.getElementById('ta_'+blockId+'_'+s.id); stages[s.id] = ta ? ta.value : ''; });
    patch = { stages };
  }else if(block.type === 'list'){
    const wrap = document.getElementById('listwrap_'+blockId);
    const items = wrap ? Array.from(wrap.querySelectorAll('input[type="text"]')).map(inp=>inp.value) : [''];
    patch = { items: items.length ? items : [''] };
  }else if(BLOCK_SECTIONS[blockId]){
    const secs = BLOCK_SECTIONS[blockId];
    const sections = {};
    secs.forEach((sec,idx)=>{ const ta = document.getElementById('ta_'+blockId+'_s'+idx); sections[idx] = ta ? ta.value : ''; });
    const combined = secs.map((sec,idx)=> sec.label+':\n'+(sections[idx]||'')).join('\n\n');
    patch = { sections, text: combined };
  }else if(block.type === 'channels'){
    const wrap = document.getElementById('chdec_'+blockId);
    const budgets = {};
    const reasons = {};
    if(wrap){
      const c = CASES[slug] || null;
      const task = c ? c.tasks[blockId] : null;
      (task && task.channels ? task.channels : []).forEach((ch,idx)=>{
        const inp = document.getElementById('chb_'+blockId+'_'+idx);
        const ta = document.getElementById('chr_'+blockId+'_'+idx);
        if(inp) budgets[idx] = inp.value;
        if(ta) reasons[idx] = ta.value;
      });
    }
    patch = { budgets, reasons };
  }else{
    const ta = document.getElementById('ta_'+blockId);
    patch = { text: ta ? ta.value : '' };
    if(BLOCK_CHOICES[blockId]){
      const choiceBlockEl = document.getElementById('block_'+blockId);
      const checkedInp = choiceBlockEl ? choiceBlockEl.querySelector('.cblist input[type=checkbox]:checked') : null;
      const checkedLbl = checkedInp ? checkedInp.closest('.cbitem') : null;
      patch.choice = checkedLbl ? checkedLbl.querySelector('span').textContent : null;
      if(blockId === 'strategy' && STRATEGY_ANSWER[slug]){
        patch.checkedItems = { correct_strategy: patch.choice === STRATEGY_ANSWER[slug] };
        patch.checklistReviewed = true;
      }
    }
  }
  const ok = await patchTeam(slug, { answers: { [blockId]: patch } });
  if(btn) btn.disabled = false;
  if(ok){
    clearDirty(blockId);
    saveHint(blockId, 'отправлено ✓ '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}));
  }else{
    saveHint(blockId, 'не отправилось — нажмите «Отправить ответ» ещё раз');
  }
}

function parseRevDelta(baseTotal, tText){
  const toNum = s => parseFloat(String(s).replace(',', '.'));
  const mBase = String(baseTotal).match(/^[\d\s]+/);
  const before = mBase ? toNum(mBase[0].replace(/\s/g,'')) / 1000000 : null;
  const m = String(tText).match(/Выручка\s+([\d,]+)\s*→\s*([\d,]+)(?:[–\-]([\d,]+))?\s*млн/);
  if(!m || before===null) return null;
  const afterLo = toNum(m[2]);
  const afterHi = m[3] ? toNum(m[3]) : afterLo;
  const afterAvg = (afterLo + afterHi) / 2;
  const afterLabel = m[3] ? (m[2]+'–'+m[3]) : m[2];
  return { before, beforeLabel: m[1], afterAvg, afterLabel };
}
function revenueChartHtml(delta, tier){
  if(!delta) return '';
  const color = tier==='weak' ? 'var(--weak)' : tier==='strong' ? 'var(--strong)' : 'var(--gold)';
  const max = Math.max(delta.before, delta.afterAvg) * 1.12 || 1;
  const wBefore = Math.max(6, Math.round(delta.before/max*100));
  const wAfter = Math.max(6, Math.round(delta.afterAvg/max*100));
  return '<div class="revchart">'+
    '<div class="revchart-row"><div class="revchart-label">Было</div><div class="revchart-track"><div class="revchart-bar" style="width:'+wBefore+'%;background:rgba(255,255,255,.4);"></div></div><div class="revchart-val mono">'+delta.beforeLabel+' млн ₽</div></div>'+
    '<div class="revchart-row"><div class="revchart-label">Стало</div><div class="revchart-track"><div class="revchart-bar" style="width:'+wAfter+'%;background:'+color+';"></div></div><div class="revchart-val mono">'+delta.afterLabel+' млн ₽</div></div>'+
  '</div>';
}

let aiLoading = {}, aiError = {}, aiBlocked = null;

// Единая точка вызова ИИ: в claude.ai использует встроенную капабилити sampleCap,
// вне claude.ai (например на GitHub Pages) идёт через наш Apps Script backend (action:'ai'),
// который сам обращается к Gemini на сервере — ключ никогда не попадает в браузер.
async function aiJson(prompt){
  if(sampleCap){
    return await sampleCap.json(prompt, { modelTier: 'default' });
  }
  if(remoteAvailable){
    let resp;
    try{
      resp = await remotePost({ action: 'ai', prompt });
    }catch(e){
      const err = new Error('network'); err.code = 'upstream_error'; throw err;
    }
    if(!resp || !resp.ok){
      const rawCode = (resp && resp.error) || 'upstream_error';
      const known = ['rate_limited','invalid_json','prompt_too_large','upstream_error','empty_completion','refused'];
      const err = new Error(rawCode);
      err.code = rawCode === 'no_api_key' ? 'not_declared' : (known.includes(rawCode) ? rawCode : 'upstream_error');
      throw err;
    }
    if(!resp.result || typeof resp.result !== 'object'){
      const err = new Error('invalid_json'); err.code = 'invalid_json'; throw err;
    }
    return resp.result;
  }
  const err = new Error('not_declared'); err.code = 'not_declared'; throw err;
}

  if(aiBlocked) return;
  if(!sampleCap && !remoteAvailable){
    aiBlocked = { code:'not_declared', message:'ИИ недоступен в этом окне. Попробуйте открыть страницу заново.' };
    if(tutorOpenSlug===slug){ const t = await ensureTeam(slug); renderDetailBlocks(slug, t); }
    return;
  }
  const c = CASES[slug];
  const block = BLOCKS.find(x=>x.id===blockId);
  const task = c.tasks[blockId];
  const items = CHECKLISTS[slug][blockId];
  const team = await ensureTeam(slug);
  const answerText = answerPlainText(block, team.answers?.[blockId] || {}, task);
  if(!answerText.trim()) return;
  delete aiError[blockId];
  aiLoading[blockId] = true;
  if(tutorOpenSlug===slug) renderDetailBlocks(slug, team);
  const itemsList = items.map((it,i)=> (i+1)+'. ['+it.id+'] '+it.label).join('\n');
  const prompt = 'Ты — куратор бизнес-симуляции на офлайн-курсе "Прибыльная стоматология" центра Ильи Склярова. Оцени ответ команды по конкретному чек-листу решений, а не абстрактно — так, как это сделал бы на разборе сам Илья Скляров.\n\n'+
    'В первую очередь опирайся на подход и методологию Ильи Склярова для премиального стоматологического бизнеса (методика "Проблема → Причина → Решение", управление через показатели и мотивацию персонала, сервис и путь пациента, дифференциация не через "качество" и "опытных врачей", а через конкретное отличие, оценка эффективности решений по общей практике управления клиниками). Только если методология центра прямо не покрывает частность — опирайся на общепринятые принципы стоматологического менеджмента.\n\n'+
    'Клиника: '+c.name+', '+c.city+'. Проблемы клиники: '+c.problems+'.\n\n'+
    'Задание блока: '+stripHtml(task.text)+'\n\n'+
    'Чек-лист решений, которые команда должна была найти или предложить (оценивай по смыслу и практической эффективности, а не по точному совпадению формулировок):\n'+itemsList+'\n\n'+
    'Ответ команды:\n"""\n'+answerText+'\n"""\n\n'+
    'Ответь ТОЛЬКО JSON вида {"checked": {"'+items[0].id+'": true|false, ... по каждому id из списка выше}, "extra": "если команда рационально и логично для этой клиники нашла ещё какую-то проблему или решение, не входящее в чек-лист — коротко опиши по-русски, иначе пустая строка", "rationale": "1-2 предложения по-русски — что повлияло на оценку и на что обратить внимание ведущему"}.';
  try{
    const data = await aiJson(prompt);
    const checked = {};
    items.forEach(it=>{ checked[it.id] = !!(data.checked && data.checked[it.id]); });
    const extra = String(data.extra || '').slice(0, 400);
    const rationale = String(data.rationale || '').slice(0, 500);
    await patchTeam(slug, { answers: { [blockId]: { aiChecked: checked, aiExtra: extra, aiRationale: rationale } } });
  }catch(e){
    const info = aiErrorMessage(e);
    if(info.terminal) aiBlocked = { code: info.code, message: info.message };
    else aiError[blockId] = info.message;
  }
  delete aiLoading[blockId];
  if(tutorOpenSlug===slug){ const t2 = await ensureTeam(slug); renderDetailBlocks(slug, t2); }
}

// ---------- boot ----------
(async function(){
  await initCaps();
  route();
  // страница-хост иногда «доустанавливает» хэш чуть позже первого рендера — перепроверим
  setTimeout(route, 250);
})();
</script>
